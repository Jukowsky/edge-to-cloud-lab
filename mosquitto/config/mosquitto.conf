# Plain MQTT on 1883, no auth or TLS: lab only (see README roadmap)
listener 1883
allow_anonymous true

# Keep retained messages and persistent sessions across broker restarts
persistence true
persistence_location /mosquitto/data/

# Forget persistent sessions of clients that have been gone for a week,
# otherwise their queues grow forever
persistent_client_expiration 7d

# Log to stdout so `docker logs mosquitto` shows connects, disconnects and wills
log_dest stdout
log_type all

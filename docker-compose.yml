services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  plc-sim:
    build: .
    container_name: plc-sim
    command: python plc_simulator/opcua_server.py
    ports:
      - "4840:4840"
    restart: unless-stopped

  gateway:
    build: .
    container_name: gateway
    command: python -m gateway.main
    environment:
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://plc-sim:4840/location1/}
      OPCUA_OBJECT: ${OPCUA_OBJECT:-ns=2;s=Transformer3}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-edge-gateway-1}
      TOPIC_PREFIX: ${TOPIC_PREFIX:-site/location1/station1}
      BUFFER_PATH: /data/buffer.db
      BUFFER_MAX_MESSAGES: ${BUFFER_MAX_MESSAGES:-100000}
    volumes:
      - gateway-data:/data
    depends_on:
      - plc-sim
      - mosquitto
    restart: unless-stopped

  cloud-consumer:
    build: .
    container_name: cloud-consumer
    command: python cloud/consumer.py
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  gateway-data:
